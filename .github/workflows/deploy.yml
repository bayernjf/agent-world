name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["dev"]

jobs:
  deploy:
    name: Deploy to Hasee
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, production]
    steps:
      - name: Deploy
        run: /opt/agent-world/deploy.sh
