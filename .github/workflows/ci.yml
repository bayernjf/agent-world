name: CI

on:
  push:
    branches: ["main", "master", "dev", "feature/**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    name: Typecheck, build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        # Block merges on known high/critical CVEs. `pnpm audit` exits non-zero
        # when a vulnerable dependency is at/above the level, turning CI red
        # until the dependency is upgraded.
        run: pnpm audit --audit-level=high

      - name: Install Playwright browsers
        # The RPA read-back browser tests (rpa.browser.test.ts) launch a real
        # Chromium; `pnpm install` does not fetch the browser binary, so it must
        # be installed explicitly or those tests fail with "Executable doesn't
        # exist". playwright is a dependency of @agent-world/server, so scope the
        # exec to that package (a bare `pnpm exec` from the workspace root can't
        # resolve the binary).
        run: pnpm --filter @agent-world/server exec playwright install --with-deps chromium

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        # Root typecheck = every workspace package plus tsconfig.scripts.json, which is
        # the only coverage the maintenance scripts in scripts/ ever get.
        run: pnpm typecheck

      - name: i18n guard
        # Two things gate here: every {{interpolation}} present in both
        # languages, and no pack key that source can no longer reach. The second
        # one used to rot silently - 817 dead keys had piled up before the first
        # prune (2026-09-24), and the old scanner could not tell them apart from
        # keys addressed through defaultNS or a runtime prefix.
        run: |
          pnpm --filter @agent-world/web i18n:check
          pnpm --filter @agent-world/web i18n:prune -- --check

      - name: Test
        # 2-vCPU GitHub runners starve code-node subprocesses under full
        # parallel load, turning healthy runs into spurious timeouts (even
        # RLIMIT_CPU can't fire when a loop can't accumulate 1s of CPU).
        # Run test files one at a time so code nodes get enough CPU.
        run: pnpm -r --if-present test -- --maxWorkers=1

      - name: Install Playwright browser for E2E
        # The root @playwright/test can pin a different Chromium build than
        # the server's RPA playwright installed above; fetch the root-pinned
        # build into the shared browser cache (OS deps are already installed).
        run: pnpm e2e:install

      - name: E2E tests
        # Playwright auto-starts an isolated server (:8792) + web (:5174) on
        # a throwaway DB with ALLOW_DEMO/ALLOW_REGISTRATION enabled (see
        # playwright.config.ts). The suite never runs a pipeline, so it needs
        # no secrets; core is already built above for the tsx-run server.
        run: pnpm e2e

  secrets:
    name: Secret leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
