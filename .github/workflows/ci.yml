name: CI

on:
  push:
    branches: ["main", "master", "feature/**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    name: Typecheck, build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        # The RPA read-back browser tests (rpa.browser.test.ts) launch a real
        # Chromium; `pnpm install` does not fetch the browser binary, so it must
        # be installed explicitly or those tests fail with "Executable doesn't
        # exist".
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        # 2-vCPU GitHub runners starve code-node subprocesses under full
        # parallel load, turning healthy runs into spurious timeouts (even
        # RLIMIT_CPU can't fire when a loop can't accumulate 1s of CPU).
        # Run test files one at a time so code nodes get enough CPU.
        run: pnpm -r --if-present test -- --maxWorkers=1

  secrets:
    name: Secret leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
