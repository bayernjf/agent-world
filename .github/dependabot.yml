version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Collapse routine weekly version bumps into ONE PR so dozens of separate
    # lockfile-twiddling PRs don't pile up (and don't fight over pnpm-lock.yaml).
    # Security updates are exempt from groups: advisories still open their own
    # individual PRs immediately, so a CVE fix can be reviewed and merged alone.
    groups:
      npm-dependencies:
        patterns: ["*"]
    # Dependabot opens PRs for out-of-date deps; CI's `pnpm audit` gate then
    # blocks merges when a known CVE is present. Both together = supply-chain
    # scanning (engineering-blueprint §4).
    # zod 3 → 4 is a breaking change (z.record() signature, z.infer /
    # z.discriminatedUnion inference) causing ~1.2k downstream type errors in
    # @agent-world/server. It needs a dedicated migration, not an automated
    # major bump. Keep zod on 3.x until that migration is scheduled.
    # @types/node should track the CI/production runtime (Node 24, see
    # engines and ci.yml). The 26.x types changed Buffer's underlying
    # ArrayBufferLike definition, breaking BlobPart assignment in
    # artifact-store.ts (PR #186).
    # @vitejs/plugin-react 6.x has peer `vite: ^8` and imports `vite/internal`,
    # so it crashes vite.config.ts loading on Vite 6 (PR #203). 5.x is the
    # newest line that still supports Vite 6. Lift this when Vite is upgraded.
    ignore:
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
