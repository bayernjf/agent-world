services:
  agent-world:
    build:
      context: .
      dockerfile: Dockerfile
    image: bayernjf/agent-world:latest
    ports:
      - "8791:8791"
    environment:
      PORT: "8791"
      # Restrict CORS to your frontend origin in any shared deployment:
      # CORS_ORIGINS: "https://your-app.example.com"
      # Provider credentials read from env (the builtin model is fail-closed without a key):
      # AGNES_API_KEY: "${AGNES_API_KEY}"
      # MCP_SERVERS: "${MCP_SERVERS}"
      DB_FILE: "/data/agent-world.sqlite"
    # The server reads its operator knobs from the process environment; compose
    # only interpolates ${...} above, so without this block a value written to
    # the repository-root .env never reaches the container. Optional so a bare
    # checkout still boots (the builtin model and CORS then stay local-only).
    env_file:
      - path: .env
        required: false
    volumes:
      - agent-world-data:/data
    restart: unless-stopped

volumes:
  agent-world-data:
